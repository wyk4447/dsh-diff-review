name: check

# The plugin has no dependencies, so the check is the same everywhere: parse
# every file, compare the two dictionaries, wire the plugin to a fake host and
# let the suites run against it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest runtime the manifest still claims, and the one in use.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: lint
        run: node scripts/lint.mjs
      - name: smoke
        run: node scripts/smoke.mjs
      - name: test
        run: npm test
